name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
      JWT_SECRET: test-jwt-secret-for-vitest-only-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun run scripts/seed.ts
      - run: bunx vitest run --coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./db/test.db
      JWT_SECRET: test-jwt-secret-for-vitest-only-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun run scripts/seed.ts
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # SEGURIDAD (AX-14): auditoría de dependencias, escaneo de secretos y SAST
  # Las pruebas de carga k6 corren contra preproducción con un servidor levantado

  dependency-audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Falla ante vulnerabilidades de severidad alta o crítica.
      - name: bun audit
        run: bun audit --audit-level=high

  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto retirado del árbol sigue estando
          # comprometido si quedó en algún commit anterior.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  forbidden-artifacts:
    name: Artefactos prohibidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AX-12: la base de datos y el almacenamiento de usuarios nunca deben
      # llegar al repositorio. Contienen hashes, correos, pagos y
      # transcripciones de sesión.
      - name: Verificar que no se versionan bases de datos ni documentos
        run: |
          found=$(git ls-files | grep -E '(^db/|\.db$|\.sqlite3?$|^storage/)' | grep -v '^db/.gitkeep' || true)
          if [ -n "$found" ]; then
            echo "::error::Se encontraron artefactos prohibidos en el control de versiones:"
            echo "$found"
            exit 1
          fi
          echo "OK: sin bases de datos ni documentos de usuario versionados."
